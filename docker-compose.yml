version: '3.8'

services:
  # Web Server (Apache with PHP)
  web:
    build: .
    image: php:7.4-apache
    container_name: web_server
    ports:
      - "8080:80"  # Map port 8080 on your host to port 80 in the container
    volumes:
      - ./:/var/www/html  # Mount your local htdocs folder to the container
    depends_on:
      - db
    networks:
      - app-network

  # MySQL Database
  db:
    image: mysql:5.7
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Set your MySQL root password
      MYSQL_DATABASE: mydatabase         # Default database name
      MYSQL_USER: user                   # MySQL user
      MYSQL_PASSWORD: password           # MySQL user password
      MYSQL_ROOT_HOST: '%'               # Allow root access from any host
    ports:
      - "3306:3306"  # Map MySQL port 3306
    volumes:
      - ./mysql-data:/var/lib/mysql  # Persist MySQL data
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - app-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8081:80"  # Access phpMyAdmin on port 8081
    environment:
      PMA_HOST: db  # Connect phpMyAdmin to the MySQL service
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - app-network

# Define the custom network
networks:
  app-network:
    driver: bridge